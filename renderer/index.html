<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'">
<title>FARCIPAL Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shake">

  <header class="topbar">
    <a class="brand" href="https://github.com/apomous/farsipal-launcher" target="_blank" aria-label="Farcipal Launcher">
      <img class="mark" src="icon-small.svg" alt="">
      <span class="brand-name">FARCIPAL</span>
      <span class="brand-div" aria-hidden="true"></span>
      <span class="brand-sub">launcher</span>
    </a>
        <div class="top-right">
      <!-- ВКЛАДКИ С ПЛАШКОЙ -->
      <div class="nav-tabs">
        <div class="tab-indicator" id="tabIndicator"></div>
        <button class="tab active" data-target="play">ИГРАТЬ</button>
        <button class="tab" data-target="store">МАГАЗИН</button>
        <button class="tab" data-target="settings">НАСТРОЙКИ</button>
      </div>

      <time class="clock" id="clock">00:00:00</time>
      
      <span class="pill"><span class="dot" id="pillDot" data-s="idle"></span><span id="pillText">готов</span></span>
      
      <div class="wbtns">
        <button class="wbtn" id="wmin" type="button" aria-label="Свернуть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button class="wbtn close" id="wclose" type="button" aria-label="Закрыть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </header>

  <main class="stage">
    <aside class="panel profile" aria-label="Профиль">
      <div class="who">
        <div class="avatar" id="avatar" aria-hidden="true">?</div>
        <div class="who-text">
          <div class="pname" id="pname">Гость</div>
          <div class="psub" id="psub">демо-режим</div>
        </div>
      </div>
      <button class="acct" id="acct" type="button"><span id="acctText">Войти через Microsoft</span></button>
      <label class="field nick" id="nickWrap">
        <span>Ник для демо</span>
        <input id="q" type="text" maxlength="16" spellcheck="false" autocomplete="off" placeholder="Steve_01">
      </label>
      <label class="field">
        <span>Версия</span>
        <select id="ver"><option>загрузка…</option></select>
      </label>
      <label class="check"><input id="snap" type="checkbox"> Показывать снапшоты</label>
      <label class="field">
        <div class="ram-header">
          <span>Память RAM </span>
          <output id="ramOut">4 ГБ</output>
        </div>
        <span class="ram-hint">(рекомендую ставить не менее 8гб)</span>
        <div class="ram-range">
          <span class="ram-min">4</span>
          <input id="ram" type="range" min="4" max="16" step="1" value="4">
          <span class="ram-max">16</span>
        </div>
      </label>
      <label class="check" id="joinWrap"><input id="join" type="checkbox"> Заходить на сервер сразу</label>
    </aside>

    <section class="core" aria-label="Запуск">
      <button class="play" id="play" type="button" data-s="idle"><span class="face"><span id="playText">ЗАПУСТИТЬ</span></span></button>
      <div class="progress" id="progress" aria-hidden="true"><i></i></div>
      <div class="status" role="status" aria-live="polite">
        <span class="dot" id="statusDot" data-s="idle"></span>
        <span id="statusText">готов</span>
        <span class="timer" id="timer">00:00.000</span>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <aside class="side" id="cards" aria-label="Новости"></aside>

    <section class="panel term" aria-label="Журнал">
      <p class="section-label">журнал</p>
      <div class="log" id="log"></div>
    </section>
  </main>

  <canvas id="web" aria-hidden="true"></canvas>

  <div id="eyeLayer" aria-hidden="true">
    <div id="eye">

      <!-- 1. ПЛОТЬ: неидеальная форма, кожа, складки, тень под глазом. Рисуется один раз -->
      <svg id="eyeMass" viewBox="-130 -130 260 260">
        <defs>
          <filter id="blur9" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" /></filter>
          <filter id="blurS" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.8" /></filter>
          <filter id="skinA" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="7" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" result="disp" />
            <feDiffuseLighting in="n" surfaceScale="2.6" lighting-color="#ffffff" result="lit">
              <feDistantLight azimuth="235" elevation="55" />
            </feDiffuseLighting>
            <feComposite in="lit" in2="disp" operator="in" result="litIn" />
            <feBlend in="disp" in2="litIn" mode="multiply" />
          </filter>
          <radialGradient id="massFill" cx="35%" cy="30%" r="84%">
            <stop offset="0" stop-color="#525a5b" /><stop offset=".36" stop-color="#2d3233" />
            <stop offset=".7" stop-color="#121516" /><stop offset="1" stop-color="#030404" />
          </radialGradient>
          <radialGradient id="massSheen"><stop offset="0" stop-color="#eef6f2" stop-opacity=".2" /><stop offset="1" stop-color="#eef6f2" stop-opacity="0" /></radialGradient>
          <linearGradient id="rimGreen" x1="0" y1="0" x2="1" y2="1">
            <stop offset=".3" stop-color="#3dcf6f" stop-opacity="0" /><stop offset="1" stop-color="#3dcf6f" stop-opacity=".7" />
          </linearGradient>
          <clipPath id="massClip"><path id="massClipPath" /></clipPath>
        </defs>
        <ellipse cx="0" cy="40" rx="86" ry="66" fill="#000" opacity=".78" filter="url(#blur9)" />
        <path id="massShape" fill="url(#massFill)" />
        <g clip-path="url(#massClip)">
          <path id="massTex" fill="url(#massFill)" filter="url(#skinA)" />
          <g id="massDetail"></g>
          <ellipse cx="-42" cy="-62" rx="54" ry="26" fill="url(#massSheen)" transform="rotate(-26 -42 -62)" />
          <ellipse cx="40" cy="72" rx="48" ry="13" fill="url(#massSheen)" opacity=".45" transform="rotate(-10 40 72)" />
        </g>
        <path id="massEdge" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="1.9" />
        <path id="massRim" fill="none" stroke="url(#rimGreen)" stroke-width="1.6" />
        <path id="massGloss" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="1.5" stroke-linecap="round" />
      </svg>

      <!-- 2. ГЛАЗНОЕ ЯБЛОКО: видно только в проёме между веками. Текстура едет вместе со взглядом -->
      <div id="eyeBallWrap">
        <svg id="eyeBall" viewBox="-130 -130 260 260">
          <defs>
            <filter id="skinB" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
              <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" seed="23" result="n" />
              <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G" result="disp" />
              <feDiffuseLighting in="n" surfaceScale="2.6" lighting-color="#ffffff" result="lit">
                <feDistantLight azimuth="235" elevation="56" />
              </feDiffuseLighting>
              <feComposite in="lit" in2="disp" operator="in" result="litIn" />
              <feBlend in="disp" in2="litIn" mode="multiply" />
            </filter>
            <filter id="vBlur1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.15" /></filter>
            <filter id="vBlur2" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.6" /></filter>
            <filter id="vBlur3" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="0.8" /></filter>
            <radialGradient id="scleraFill" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#d4d0ba" /><stop offset=".6" stop-color="#b3af99" /><stop offset="1" stop-color="#8d8975" />
            </radialGradient>
            <clipPath id="texClip"><circle r="118" /></clipPath>
          </defs>
          <circle r="118" fill="url(#scleraFill)" filter="url(#skinB)" />
          <g id="ballBlotches" clip-path="url(#texClip)"></g>
          <!-- вены под плёнкой: полупрозрачные и размытые -->
          <g clip-path="url(#texClip)">
            <g id="veinShadow" fill="#0c1a12" opacity=".34" filter="url(#vBlur2)"></g>
            <g id="veinBody" fill="#2f8a62" opacity=".74" filter="url(#vBlur1)"></g>
            <g id="veinHi" fill="#a6ecc8" opacity=".36" filter="url(#vBlur3)"></g>
          </g>
        </svg>
      </div>

      <!-- 3. ЖИВОЙ СЛОЙ: радужка, зрачок, блики, тени от век, края век -->
      <svg id="eyeLive" viewBox="-130 -130 260 260">
        <defs>
          <clipPath id="apClip"><path id="apPath" d="M0 0" /></clipPath>
          <radialGradient id="aura">
            <stop offset="0" style="stop-color:var(--ec)" stop-opacity="0" /><stop offset=".72" style="stop-color:var(--ec)" stop-opacity="0" /><stop offset=".84" style="stop-color:var(--ec)" stop-opacity=".17" /><stop offset="1" style="stop-color:var(--ec)" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="irisFill" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#0a2a18" /><stop offset=".26" stop-color="#1f8c4e" />
            <stop offset=".48" stop-color="#17703e" /><stop offset=".74" stop-color="#0b3d23" />
            <stop offset=".92" stop-color="#05190e" /><stop offset="1" stop-color="#020805" />
          </radialGradient>
          <radialGradient id="irisRecess" cx="62%" cy="64%" r="74%">
            <stop offset=".46" stop-color="#000" stop-opacity="0" /><stop offset="1" stop-color="#000" stop-opacity=".94" />
          </radialGradient>
          <radialGradient id="pupilGlow">
            <stop offset=".3" style="stop-color:var(--ec)" stop-opacity=".4" /><stop offset="1" style="stop-color:var(--ec)" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="pupilShade">
            <stop offset=".42" stop-color="#000" stop-opacity=".96" /><stop offset="1" stop-color="#000" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="corneaGlow">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".7" /><stop offset=".5" stop-color="#ecfff2" stop-opacity=".28" />
            <stop offset="1" stop-color="#ecfff2" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="wetBig">
            <stop offset="0" stop-color="#f4fff6" stop-opacity=".34" /><stop offset=".6" stop-color="#f4fff6" stop-opacity=".1" />
            <stop offset="1" stop-color="#f4fff6" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="sphereShade" cx="44%" cy="42%" r="50%">
            <stop offset=".3" stop-color="#000" stop-opacity="0" /><stop offset=".56" stop-color="#000" stop-opacity=".46" />
            <stop offset=".78" stop-color="#000" stop-opacity=".82" /><stop offset="1" stop-color="#000" stop-opacity=".97" />
          </radialGradient>
          <radialGradient id="bounce"><stop offset="0" style="stop-color:var(--ec)" stop-opacity=".2" /><stop offset="1" style="stop-color:var(--ec)" stop-opacity="0" /></radialGradient>
          <radialGradient id="cornerShade">
            <stop offset="0" stop-color="#000" stop-opacity=".85" /><stop offset=".6" stop-color="#000" stop-opacity=".38" /><stop offset="1" stop-color="#000" stop-opacity="0" />
          </radialGradient>
          <path id="edgeU" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          <path id="edgeL" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </defs>

        <circle r="128" fill="url(#aura)" />

        <!-- неоновые прожилки на плоти: энергия течёт к корням -->
        <g id="surf" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path id="svGlow" style="stroke:var(--ec)" stroke-opacity=".12" stroke-width="3.6" />
          <path id="svCore" style="stroke:var(--ec)" stroke-opacity=".72" stroke-width="1" />
          <path id="svArc" style="stroke:var(--ec)" stroke-opacity=".32" stroke-width=".7" stroke-dasharray="2 5" />
          <path id="svP0" stroke="#d8ffe6" stroke-opacity=".85" stroke-width="1.3" stroke-dasharray="4 70" />
          <path id="svP1" stroke="#d8ffe6" stroke-opacity=".75" stroke-width="1.3" stroke-dasharray="4 96" />
          <path id="svP2" stroke="#d8ffe6" stroke-opacity=".8" stroke-width="1.3" stroke-dasharray="4 58" />
        </g>

        <g clip-path="url(#apClip)">
          <circle id="tint" r="124" style="fill:var(--ec)" opacity="0" />

          <g id="irisMove"><g transform="scale(0.78)">
            <circle r="52" fill="url(#irisFill)" />
            <g id="fibA"></g><g id="fibB"></g><g id="fibC"></g>
            <circle r="30" fill="none" stroke="#7cf0aa" stroke-opacity=".2" stroke-width=".8" stroke-dasharray="1.5 3.5" />
            <g id="sweepA"><circle r="45" fill="none" style="stroke:var(--ec)" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="26 260" /></g>
            <g id="sweepB"><circle r="38" fill="none" style="stroke:var(--ec)" stroke-width=".8" stroke-linecap="round" stroke-dasharray="11 230" /></g>
            <circle r="52" fill="url(#irisRecess)" />
            <path d="M 39.6 24.5 A 46.5 46.5 0 0 1 -6 46.1" fill="none" stroke="#b4ffd0" stroke-opacity=".3" stroke-width="2.2" stroke-linecap="round" />
            <circle r="49.2" fill="none" stroke="#000" stroke-opacity=".82" stroke-width="6" />
            <circle r="52" fill="none" style="stroke:var(--ec)" stroke-opacity=".7" stroke-width=".9" />
            <g id="pupilMove">
              <ellipse id="pupilGlow" rx="38" ry="38" fill="url(#pupilGlow)" />
              <ellipse id="pupilShade" rx="31" ry="31" fill="url(#pupilShade)" />
              <ellipse id="pupil" rx="21" ry="21" fill="#010203" style="stroke:var(--ec)" stroke-opacity=".9" stroke-width="1.3" />
              <circle id="pupilGlint" cx="-6" cy="-7" r="2.7" fill="#fff" opacity=".6" />
            </g>
          </g></g>

          <!-- роговица: большой мягкий блик, глаз влажный -->
          <g id="cornea">
            <ellipse cx="-15" cy="-26" rx="34" ry="21" fill="url(#corneaGlow)" transform="rotate(-30 -15 -26)" />
            <ellipse cx="-27" cy="-34" rx="7" ry="3.5" fill="#fff" opacity=".9" transform="rotate(-30 -27 -34)" />
            <path d="M 27 29 A 40 40 0 0 1 -4 41" fill="none" stroke="#dcffea" stroke-opacity=".22" stroke-width="2.4" stroke-linecap="round" />
          </g>

          <!-- объём шара: в центре светлее, к краям уходит в глубокую тень -->
          <circle r="124" fill="url(#sphereShade)" />
          <ellipse cx="-52" cy="-36" rx="32" ry="14" fill="url(#wetBig)" transform="rotate(-28 -52 -36)" />

          <!-- веки нависают: тени от краёв внутрь глаза -->
          <use href="#edgeU" transform="translate(0 10)" stroke="#000" stroke-opacity=".14" stroke-width="34" />
          <use href="#edgeU" transform="translate(0 6.5)" stroke="#000" stroke-opacity=".2" stroke-width="20" />
          <use href="#edgeU" transform="translate(0 3.5)" stroke="#000" stroke-opacity=".34" stroke-width="10" />
          <use href="#edgeL" transform="translate(0 -6)" stroke="#000" stroke-opacity=".14" stroke-width="22" />
          <use href="#edgeL" transform="translate(0 -3)" stroke="#000" stroke-opacity=".26" stroke-width="10" />

          <!-- уголки глаз: впалые -->
          <ellipse cx="0" cy="64" rx="62" ry="16" fill="url(#bounce)" />
          <ellipse cx="-84" cy="8" rx="30" ry="46" fill="url(#cornerShade)" />
          <ellipse cx="84" cy="2" rx="26" ry="42" fill="url(#cornerShade)" opacity=".85" />
        </g>

        <g id="lidFx">
        <!-- валики век: подсветка, складка-тень (feather из нескольких штрихов) -->
        <use href="#edgeU" transform="translate(0 -24)" stroke="#000" stroke-opacity=".12" stroke-width="22" />
        <use href="#edgeU" transform="translate(0 -22)" stroke="#000" stroke-opacity=".18" stroke-width="12" />
        <use href="#edgeU" transform="translate(0 -9)" stroke="#8a9896" stroke-opacity=".06" stroke-width="22" />
        <use href="#edgeU" transform="translate(0 -9)" stroke="#8a9896" stroke-opacity=".09" stroke-width="13" />
        <use href="#edgeU" transform="translate(0 -9)" stroke="#a6b4b1" stroke-opacity=".1" stroke-width="6" />
        <use href="#edgeL" transform="translate(0 10)" stroke="#8a9896" stroke-opacity=".05" stroke-width="22" />
        <use href="#edgeL" transform="translate(0 10)" stroke="#8a9896" stroke-opacity=".08" stroke-width="12" />
        <use href="#edgeL" transform="translate(0 24)" stroke="#000" stroke-opacity=".16" stroke-width="18" />
        </g>
        <!-- края век: тёмная плоть, неровная, влажный блик прерывистый -->
        <use href="#edgeU" transform="translate(0 -17)" stroke="#000" stroke-opacity=".34" stroke-width="1.6" stroke-dasharray="46 12 22 9 60 14" />
        <use href="#edgeU" stroke="#2a2f30" stroke-opacity=".95" stroke-width="11" />
        <use href="#edgeU" stroke="#3a4040" stroke-opacity=".5" stroke-width="13" stroke-dasharray="28 16 44 11 20 18" />
        <use href="#edgeU" transform="translate(0 1.3)" stroke="#060707" stroke-width="5" />
        <use href="#edgeU" transform="translate(0 -3)" stroke="#a8b4b0" stroke-opacity=".34" stroke-width="1.2" stroke-dasharray="34 8 16 6 48 10" />
        <use href="#edgeU" transform="translate(0 3.4)" style="stroke:var(--ec)" stroke-opacity=".46" stroke-width="1" />

        <use href="#edgeL" stroke="#2c3132" stroke-opacity=".95" stroke-width="12" />
        <use href="#edgeL" stroke="#3b4141" stroke-opacity=".45" stroke-width="14" stroke-dasharray="22 12 38 14 26 10" />
        <use href="#edgeL" transform="translate(0 -1.3)" stroke="#060707" stroke-width="4.6" />
        <use href="#edgeL" transform="translate(0 -3)" stroke="#a8b4b0" stroke-opacity=".28" stroke-width="1.2" stroke-dasharray="30 9 20 7 40 11" />
        <use href="#edgeL" transform="translate(0 -3.3)" style="stroke:var(--ec)" stroke-opacity=".36" stroke-width="1" />

        <g id="rings"></g>
      </svg>
    </div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
</div>

<script src="companion.js"></script>
<script src="app.js"></script>
</body>
</html>
