<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'">
<title>FARCIPAL Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shake">

  <header class="topbar">
    <a class="brand" href="#" aria-label="Farcipal Launcher">
      <svg class="mark" viewBox="-15 -15 30 30" aria-hidden="true">
        <defs>
          <linearGradient id="markStroke" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#eafff1" /><stop offset=".45" stop-color="#3dcf6f" /><stop offset="1" stop-color="#16562f" />
          </linearGradient>
        </defs>
        <circle r="13.6" fill="#07090e" stroke="url(#markStroke)" stroke-width="1" />
        <circle r="7" fill="none" stroke="#3dcf6f" stroke-opacity=".7" stroke-width=".9" />
        <ellipse rx="2.2" ry="3.4" fill="#010203" stroke="#3dcf6f" stroke-width=".7" />
      </svg>
      <span class="brand-name">FARCIPAL</span>
      <span class="brand-div" aria-hidden="true"></span>
      <span class="brand-sub">launcher</span>
    </a>
    <div class="top-right">
      <time class="clock" id="clock">00:00:00</time>
      <span class="pill"><span class="dot" id="pillDot" data-s="idle"></span><span id="pillText">готов</span></span>
      <div class="wbtns">
        <button class="wbtn" id="wmin" type="button" aria-label="Свернуть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button class="wbtn close" id="wclose" type="button" aria-label="Закрыть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </header>

  <main class="stage">
    <aside class="panel profile" aria-label="Профиль">
      <div class="who">
        <div class="avatar" id="avatar" aria-hidden="true">?</div>
        <div class="who-text">
          <div class="pname" id="pname">Гость</div>
          <div class="psub" id="psub">демо-режим</div>
        </div>
      </div>
      <button class="acct" id="acct" type="button"><span id="acctText">Войти через Microsoft</span></button>
      <label class="field nick" id="nickWrap">
        <span>Ник для демо</span>
        <input id="q" type="text" maxlength="16" spellcheck="false" autocomplete="off" placeholder="Steve_01">
      </label>
      <label class="field">
        <span>Версия</span>
        <select id="ver"><option>загрузка…</option></select>
      </label>
      <label class="check"><input id="snap" type="checkbox"> Показывать снапшоты</label>
      <label class="field">
        <span>Память <output id="ramOut">4 ГБ</output></span>
        <input id="ram" type="range" min="1" max="16" step="1" value="4">
      </label>
      <label class="check" id="joinWrap"><input id="join" type="checkbox"> Заходить на сервер сразу</label>
    </aside>

    <section class="core" aria-label="Запуск">
      <button class="play" id="play" type="button" data-s="idle"><span class="face"><span id="playText">ЗАПУСТИТЬ</span></span></button>
      <div class="progress" id="progress" aria-hidden="true"><i></i></div>
      <div class="status" role="status" aria-live="polite">
        <span class="dot" id="statusDot" data-s="idle"></span>
        <span id="statusText">готов</span>
        <span class="timer" id="timer">00:00.000</span>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <aside class="side" id="cards" aria-label="Новости"></aside>

    <section class="panel term" aria-label="Журнал">
      <p class="section-label">журнал</p>
      <div class="log" id="log"></div>
    </section>
  </main>

  <canvas id="web" aria-hidden="true"></canvas>

  <div id="eyeLayer" aria-hidden="true">
    <div id="eye">

      <!-- ТЕЛО: рисуется один раз (тяжёлые фильтры), дальше двигается как готовая картинка -->
      <svg id="eyeBody" viewBox="-130 -130 260 260">
        <defs>
          <filter id="blur9" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" /></filter>
          <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5" /></filter>
          <filter id="skin" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="4" seed="11" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="disp" />
            <feDiffuseLighting in="n" surfaceScale="3.4" lighting-color="#ffffff" result="lit">
              <feDistantLight azimuth="235" elevation="50" />
            </feDiffuseLighting>
            <feComposite in="lit" in2="disp" operator="in" result="litIn" />
            <feBlend in="disp" in2="litIn" mode="multiply" />
          </filter>
          <radialGradient id="flesh" cx="36%" cy="32%" r="80%">
            <stop offset="0" stop-color="#56566e" /><stop offset=".42" stop-color="#34344a" />
            <stop offset=".78" stop-color="#1b1b27" /><stop offset="1" stop-color="#0b0b12" />
          </radialGradient>
          <clipPath id="ballClipB"><circle r="92" /></clipPath>
          <clipPath id="veinClip"><circle r="94.8" /></clipPath>
          <mask id="crescent" maskUnits="userSpaceOnUse" x="-100" y="-100" width="200" height="200">
            <circle r="92" fill="#fff" />
            <circle cx="-17" cy="-20" r="90" fill="#000" filter="url(#blur3)" />
          </mask>
        </defs>
        <circle cx="0" cy="13" r="86" fill="#000" opacity=".62" filter="url(#blur9)" />
        <circle r="92" fill="url(#flesh)" filter="url(#skin)" />
        <g id="blotches" clip-path="url(#ballClipB)"></g>
        <circle r="92" fill="#000" opacity=".5" mask="url(#crescent)" />
        <circle r="92" fill="none" stroke="#050508" stroke-width="3.6" />
        <g clip-path="url(#veinClip)"><g id="veinShadow" fill="#020204" opacity=".6"></g>
        <g id="veinMain" fill="#228f48" opacity=".95"></g></g>
        <g clip-path="url(#ballClipB)"><g id="veinHi" fill="#a8f0c2" opacity=".5"></g></g>
      </svg>

      <!-- ЖИВОЙ СЛОЙ: радужка, зрачок, веки, блики. Меняется каждый кадр, фильтров нет -->
      <svg id="eyeLive" viewBox="-130 -130 260 260">
        <defs>
          <clipPath id="clipBall"><circle r="90.6" /></clipPath>
          <radialGradient id="aura">
            <stop offset=".66" style="stop-color:var(--ec)" stop-opacity=".16" /><stop offset="1" style="stop-color:var(--ec)" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="irisFill" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0c2d19" /><stop offset="55%" stop-color="#071d10" />
            <stop offset="88%" stop-color="#040f08" /><stop offset="100%" stop-color="#020604" />
          </radialGradient>
          <radialGradient id="irisRecess" cx="60%" cy="62%" r="72%">
            <stop offset=".52" stop-color="#000" stop-opacity="0" /><stop offset="1" stop-color="#000" stop-opacity=".88" />
          </radialGradient>
          <radialGradient id="pupilShade">
            <stop offset=".35" stop-color="#000" stop-opacity=".9" /><stop offset="1" stop-color="#000" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="vignette" cx="38%" cy="34%" r="72%">
            <stop offset=".5" stop-color="#000" stop-opacity="0" /><stop offset=".82" stop-color="#000" stop-opacity=".38" />
            <stop offset="1" stop-color="#000" stop-opacity=".82" />
          </radialGradient>
          <radialGradient id="specBig">
            <stop offset="0" stop-color="#eaffef" stop-opacity=".42" /><stop offset=".55" stop-color="#cfffe0" stop-opacity=".14" />
            <stop offset="1" stop-color="#cfffe0" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
            <stop offset=".4" style="stop-color:var(--ec)" stop-opacity="0" /><stop offset="1" style="stop-color:var(--ec)" stop-opacity=".75" />
          </linearGradient>
          <linearGradient id="lidUg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0c0c12" /><stop offset=".7" stop-color="#1c1c28" /><stop offset="1" stop-color="#34344a" />
          </linearGradient>
          <linearGradient id="lidLg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3c3c52" /><stop offset=".35" stop-color="#22222f" /><stop offset="1" stop-color="#0b0b11" />
          </linearGradient>
          <linearGradient id="bandU" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity=".66" /><stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="bandL" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#000" stop-opacity=".6" /><stop offset="1" stop-color="#000" stop-opacity="0" />
          </linearGradient>
          <path id="edgeU" fill="none" stroke-linecap="round" />
          <path id="edgeL" fill="none" stroke-linecap="round" />
        </defs>

        <circle r="128" fill="url(#aura)" />
        <g clip-path="url(#clipBall)">
          <g id="veinFlow"></g>
          <circle id="tint" r="92" style="fill:var(--ec)" opacity="0" />

          <g id="irisMove"><g transform="scale(0.84)">
            <circle r="52" fill="url(#irisFill)" />
            <g id="fibA"></g><g id="fibB"></g><g id="fibC"></g>
            <circle r="30" fill="none" stroke="#2a9a52" stroke-opacity=".16" stroke-width=".8" stroke-dasharray="1.5 3.5" />
            <g id="sweepA"><circle r="45" fill="none" style="stroke:var(--ec)" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="26 260" /></g>
            <g id="sweepB"><circle r="38" fill="none" style="stroke:var(--ec)" stroke-width=".8" stroke-linecap="round" stroke-dasharray="11 230" /></g>
            <circle r="52" fill="url(#irisRecess)" />
            <path d="M 39.6 24.5 A 46.5 46.5 0 0 1 -6 46.1" fill="none" stroke="#b4ffd0" stroke-opacity=".3" stroke-width="2.2" stroke-linecap="round" />
            <circle r="50.4" fill="none" stroke="#000" stroke-opacity=".7" stroke-width="3.2" />
            <circle r="52" fill="none" style="stroke:var(--ec)" stroke-opacity=".75" stroke-width=".9" />
            <g id="pupilMove">
              <ellipse id="pupilShade" rx="31" ry="31" fill="url(#pupilShade)" />
              <ellipse id="pupil" rx="21" ry="21" fill="#010203" style="stroke:var(--ec)" stroke-opacity=".9" stroke-width="1.3" />
              <circle id="pupilGlint" cx="-6" cy="-7" r="2.7" fill="#fff" opacity=".6" />
            </g>
          </g></g>

          <!-- веки: форма пересчитывается каждый кадр -->
          <path id="bandUp" fill="url(#bandU)" />
          <path id="bandLo" fill="url(#bandL)" />
          <path id="fillUp" fill="url(#lidUg)" />
          <path id="fillLo" fill="url(#lidLg)" />
          <use href="#edgeU" transform="translate(0 4.5)" style="stroke:var(--ec)" stroke-opacity=".2" stroke-width="6" />
          <use href="#edgeL" transform="translate(0 -4.5)" style="stroke:var(--ec)" stroke-opacity=".16" stroke-width="5" />
          <use href="#edgeU" stroke="#454559" stroke-width="7.4" />
          <use href="#edgeL" stroke="#3b3b4e" stroke-width="7" />
          <use href="#edgeU" transform="translate(0 -1.9)" stroke="#9494b0" stroke-opacity=".5" stroke-width="1.6" />
          <use href="#edgeL" transform="translate(0 -1.9)" stroke="#8a8aa6" stroke-opacity=".38" stroke-width="1.4" />
          <use href="#edgeU" transform="translate(0 3.8)" style="stroke:var(--ec)" stroke-opacity=".95" stroke-width="1.4" />
          <use href="#edgeL" transform="translate(0 -3.6)" style="stroke:var(--ec)" stroke-opacity=".8" stroke-width="1.2" />
        </g>

        <circle r="91" fill="url(#vignette)" />
        <circle r="90.6" fill="none" stroke="url(#rimLight)" stroke-width="1.8" />
        <ellipse cx="-33" cy="-45" rx="34" ry="19" fill="url(#specBig)" transform="rotate(-32 -33 -45)" />
        <ellipse cx="-44" cy="-55" rx="8.5" ry="4.4" fill="#f2fff6" opacity=".7" transform="rotate(-32 -44 -55)" />
        <circle cx="-30" cy="-60" r="1.9" fill="#fff" opacity=".6" />
        <g id="rings"></g>
      </svg>
    </div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
</div>

<script src="companion.js"></script>
<script src="app.js"></script>
</body>
</html>
